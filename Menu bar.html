<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Bar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .menu {
            background-color: #2E7D32;
            color: white;
            width: 200px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            position: fixed;
            top: 60px; 
            right: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .menu h2 {
            margin: 10px 0 20px;
            text-align: center;
        }

        .menu button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background-color: #7dc776;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu button:hover {
            opacity: 0.8;
        }

        .menu-btn {
            background-color: #61da85;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">Menu Navigation</button>

    <div class="menu" id="menu">
        <h2>Menu Navigation</h2>
        <button onclick="window.location.href='Riyal.html'">Home</button>
        <button onclick="window.location.href='Article Page.html'">Articles</button>
        <button onclick="window.location.href='Success Stories.html'">Success Stories</button>
        <button onclick="window.location.href='Contact Page.html'">Therapy</button>
        <button onclick="goBack()">Back</button>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');s
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
