<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  

  <title>Thrive Mind☘️</title>
  <style>
    body {
      font-family: 'Trebuchet MS', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #262928;
      color: #f0f0dc;
      background-image: url('https://publichealth.tulane.edu/wp-content/uploads/sites/3/2021/01/Understanding-Mental-Health-as-a-Public-Health-Issue.jpg'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: top; 
      
    }

    header {
      background-color: #388a3c;
      padding: 20px;
      text-align: left;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .menu-btn {
      background-color: #61da85;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .menu {
      background-color: #5ab95e;
      color: black;
      width: 200px;
      padding: 20px;
      border-radius: 10px;
      display: none;
      position: fixed;
      top: 60px;
      right: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    .menu h2 {
      margin: 10px 0 20px;
      text-align: center;
      color: white;
    }

    .menu button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #7dc776;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .menu button:hover {
      background-color: #66bb6a;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h2 {
      font-size: 26px;
      color: #000000;
      margin-bottom: 10px;
     
      
    }

    .hero p {
      font-size: 18px;
      color: #020301;
      margin-bottom: 40px;
      
    }

    .main-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin: 0 auto;
      width: 90%;
      max-width: 500px;
    }

    .main-buttons button {
      background-color: #a0d6a4;
      color: #1b3c1d;
      font-weight: 600;
      padding: 18px 30px;
      font-size: 17px;
      border: none;
      border-radius: 30px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .main-buttons button:hover {
      background-color: #8bcf91;
    }

  </style>
</head>
<body>

  <header>
    <h1>Thrive Mind</h1>
  </header>

  <button class="menu-btn" onclick="toggleMenu()">Menu</button>

  <div class="menu" id="menu">
    <h2>Menu Navigation</h2>
    <button onclick="window.location.href='Article Page.html'">Articles</button>
    <button onclick="window.location.href='Contact page.html '">Contacts</button>
    <button onclick="window.location.href='Success Stories.html'">Success Stories</button>
    <button onclick="goBack()">Back</button>
  </div>

  <section class="hero">
    <h2>"A place where the mind can rest"</h2>
    <p>Your journey to mental wellness starts here.</p>

    <div class="main-buttons">
      <button onclick="window.location.href='Personal Therapy.html'">Personal Therapy</button>
      <button onclick="window.location.href='Booking.html'">Book a Session</button>
      <button onclick="window.location.href='Article Page.html'">Read Articles</button>
    </div>
  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function goBack() {
      window.history.back();
    }
  </script>

</body>
</html>
